---
- name: Install firewalld
  ansible.builtin.apt:
    name: firewalld
    state: present

- name: Ensure firewalld is running and enabled
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Bind trusted sources to the home zone
  ansible.posix.firewalld:
    zone: home
    source: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
    offline: true
  loop: "{{ firewalld_home_sources }}"

- name: Configure home zone services
  ansible.posix.firewalld:
    zone: home
    service: "{{ item.service }}"
    state: "{{ item.state }}"
    permanent: true
    immediate: true
    offline: true
  loop: "{{ firewalld_home_services }}"

- name: Configure public zone services
  ansible.posix.firewalld:
    zone: public
    service: "{{ item.service }}"
    state: "{{ item.state }}"
    permanent: true
    immediate: true
    offline: true
  loop: "{{ firewalld_public_services }}"
