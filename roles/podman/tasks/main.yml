---
- name: Install the Forgejo apt registry's signing key
  ansible.builtin.get_url:
    url: "https://{{ podman_apt_host }}/api/packages/{{ podman_apt_owner }}/debian/repository.key"
    dest: "/etc/apt/keyrings/forgejo-{{ podman_apt_owner }}.asc"
    url_username: "{{ podman_apt_owner }}"
    url_password: "{{ podman_apt_token }}"
    checksum: "{{ podman_apt_key_checksum }}"
    mode: "0644"
  no_log: true

- name: Write the podman apt source
  ansible.builtin.template:
    src: forgejo-podman.sources.j2
    dest: /etc/apt/sources.list.d/forgejo-podman.sources
    mode: "0600"
  no_log: true

- name: Install aardvark-dns, netavark and podman from apt registry
  ansible.builtin.apt:
    name:
      - aardvark-dns
      - netavark
      - podman
    state: latest
    update_cache: true
    cache_valid_time: 3600
    fail_on_autoremove: true

- name: Allow rootless containers to bind privileged ports
  ansible.builtin.template:
    src: 00-ansible-podman-rootless.conf.j2
    dest: /etc/sysctl.d/00-ansible-podman-rootless.conf
    mode: "0644"
  notify: apply sysctl

- name: Ensure the user's podman config directory exists
  ansible.builtin.file:
    path: "{{ podman_config_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Write podman config files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ podman_config_path }}/{{ item }}"
    owner: "{{ ansible_user }}"
    mode: "0644"
  loop:
    - containers.conf
    - policy.json

- name: Write the container registry login
  ansible.builtin.template:
    src: auth.json.j2
    dest: "{{ podman_config_path }}/auth.json"
    owner: "{{ ansible_user }}"
    mode: "0600"
  no_log: true

- name: Keep the user's systemd services running when not logged in
  ansible.builtin.command: "loginctl enable-linger {{ ansible_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ ansible_user }}"

- name: Look up the user's UID (needed for XDG_RUNTIME_DIR below)
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Enable podman-auto-update.timer
  ansible.builtin.systemd:
    name: podman-auto-update.timer
    scope: user
    state: started
    enabled: true
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[ansible_user][1] }}"
