---
- name: Find the device backing the root filesystem
  ansible.builtin.set_fact:
    journald_root_device: "{{ item.device }}"
  loop: "{{ ansible_facts['mounts'] }}"
  when: item.mount == '/'

- name: Install journal storage override
  ansible.builtin.template:
    src: 50-ansible-journald-storage.conf.j2
    dest: /etc/systemd/journald.conf.d/50-ansible-journald-storage.conf
    mode: "0644"
  when: journald_root_device.startswith('/dev/nvme')
  notify: restart systemd-journald
