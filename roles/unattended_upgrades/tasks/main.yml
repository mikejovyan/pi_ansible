---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Write the unattended-upgrades customizations
  ansible.builtin.template:
    src: 51-ansible-unattended_upgrades.j2
    dest: /etc/apt/apt.conf.d/51-ansible-unattended_upgrades
    mode: "0644"
